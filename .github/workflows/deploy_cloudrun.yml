name: Deploy to Cloud Run

on:
  workflow_dispatch:
  # Railwayに移行したため、pushトリガーを無効化
  # push:
  #   branches: [main]
  #   paths:
  #     - 'python/**'

env:
  PROJECT_ID: raku-shiftai
  REGION: asia-northeast1
  SERVICE_NAME: rakushift-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: raku-shiftai

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker gcr.io

      - name: Build and Push
        run: |
          cd python
          docker build -t gcr.io/raku-shiftai/rakushift-api:${{ github.sha }} -t gcr.io/raku-shiftai/rakushift-api:latest .
          docker push gcr.io/raku-shiftai/rakushift-api:${{ github.sha }}
          docker push gcr.io/raku-shiftai/rakushift-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rakushift-api \
            --image gcr.io/raku-shiftai/rakushift-api:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --memory 1Gi \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 5
