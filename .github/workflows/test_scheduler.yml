name: Test Scheduler

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/test_scheduler.yml'
  pull_request:
    paths:
      - 'python/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements-dev.txt

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: python
        run: |
          pytest tests/ --tb=short

      - name: Summary
        if: always()
        working-directory: python
        run: |
          echo "## テスト結果" >> $GITHUB_STEP_SUMMARY
          pytest tests/ --tb=no -q 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
